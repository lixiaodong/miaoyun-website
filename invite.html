<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>你收到了一份来自好友的邀请 · 妙言 AI</title>
  <meta name="description" content="好友邀请你使用妙言 AI，高情商 AI 输入法。"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --p1: #4F46E5; --p2: #7C3AED; --pink: #EC4899;
      --text: #1E1B4B; --muted: #6B7280; --white: #FFFFFF;
      --border: #E0D7FF; --p-light: #EEF2FF;
    }
    body {
      font-family: 'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
      color: var(--text); background: var(--white);
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 32px 5%;
      background: linear-gradient(160deg, #EEF2FF 0%, #F8F7FF 40%, #FFF 100%);
    }

    /* ── Floating deco ── */
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .deco {
      position: fixed; pointer-events: none; user-select: none;
      font-size: 32px; opacity: .18; animation: float 5s ease-in-out infinite;
    }
    .deco-1 { top: 8%; left: 6%; animation-delay: 0s; }
    .deco-2 { top: 12%; right: 8%; animation-delay: 1.5s; font-size: 24px; }
    .deco-3 { bottom: 15%; left: 10%; animation-delay: 3s; }

    /* ── Card ── */
    .card {
      background: #fff; border-radius: 24px; padding: 40px 28px 32px;
      box-shadow: 0 8px 48px rgba(79,70,229,.10), 0 1px 4px rgba(0,0,0,.04);
      max-width: 420px; width: 100%; position: relative; z-index: 1;
    }
    .avatar-row { margin-bottom: 20px; }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, var(--p1), var(--p2));
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 36px; box-shadow: 0 8px 24px rgba(79,70,229,.25);
    }
    .welcome { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
    .app-name {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--p1), var(--p2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    .tagline { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

    /* ── Invite code showcase ── */
    .code-box {
      background: var(--p-light); border: 2px dashed var(--border);
      border-radius: 16px; padding: 20px 16px; margin-bottom: 24px;
    }
    .code-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .code-value {
      font-size: 36px; font-weight: 800; letter-spacing: 6px;
      color: var(--p1); font-family: 'SF Mono','Consolas','Menlo',monospace;
    }
    .code-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* ── Buttons ── */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 16px; border-radius: 16px; font-size: 17px;
      font-weight: 700; border: none; cursor: pointer; text-decoration: none;
      transition: transform .2s, box-shadow .2s; margin-bottom: 12px;
    }
    .btn:active { transform: scale(.97); }
    .btn-dl {
      background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff;
      box-shadow: 0 8px 24px rgba(79,70,229,.35);
    }
    .btn-dl:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(79,70,229,.4); }
    .btn-open {
      background: var(--p-light); color: var(--p1);
      border: 1.5px solid var(--border);
    }
    .btn-open:hover { border-color: var(--p1); background: #E8E4FF; }

    /* ── Steps ── */
    .steps { margin-top: 28px; text-align: left; }
    .steps h4 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--muted); text-align: center; }
    .step {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 10px 0; font-size: 13px; color: var(--muted); line-height: 1.6;
    }
    .step-num {
      width: 24px; height: 24px; min-width: 24px; border-radius: 50%;
      background: var(--p-light); color: var(--p1);
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .step strong { color: var(--text); }

    /* ── Footer ── */
    .footer { margin-top: 24px; font-size: 12px; color: var(--muted); opacity: .6; }

    /* ── Toast ── */
    @keyframes toast-in { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 12px 24px;
      border-radius: 12px; font-size: 14px; font-weight: 600;
      animation: toast-in .3s ease; z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
  </style>
</head>
<body>

<div class="deco deco-1">💌</div>
<div class="deco deco-2">✨</div>
<div class="deco deco-3">💬</div>

<div class="card">
  <div class="avatar-row"><div class="avatar" id="avatar-emoji">🎁</div></div>
  <div class="welcome" id="welcome-text">你的好友邀请你使用</div>
  <div class="app-name">妙言 AI</div>
  <div class="tagline">开口即妙，言出心声</div>

  <!-- 邀请码展示 -->
  <div class="code-box" id="code-box">
    <div class="code-label">🎫 专属邀请码（已自动记录）</div>
    <div class="code-value" id="code-display">------</div>
    <div class="code-hint">下载 App 后登录时自动识别，双方各得 1 天免费时长</div>
  </div>

  <!-- 无邀请码时的隐藏展示 -->
  <div class="code-box" id="no-code-box" style="display:none; background: #FFF7ED; border-color: #FED7AA;">
    <div class="code-label">😕 未识别到邀请码</div>
    <div class="code-hint" style="margin-top:4px;">请让好友重新分享带邀请码的链接给你</div>
  </div>

  <!-- 下载按钮 -->
  <a class="btn btn-dl" id="dl-btn" href="./download.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    下载妙言 AI App
  </a>

  <!-- 打开 App（deep link 回传邀请码） -->
  <a class="btn btn-open" id="open-btn" href="https://miaoyan.co?invite=INVITE_PLACEHOLDER">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
    已安装 App？点此打开
  </a>

  <!-- 使用说明 -->
  <div class="steps">
    <h4>📋 三步完成</h4>
    <div class="step">
      <div class="step-num">1</div>
      <div><strong>下载 App</strong> — 点击上方按钮下载安装包</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div><strong>安装并登录</strong> — 打开 App 用手机号或邮箱登录，<strong>邀请码会自动识别</strong>，无需手动填写</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div><strong>各得 1 天时长</strong> — 注册成功后你和邀请人<b>各得 1 天免费会员</b> 🎉</div>
    </div>
  </div>
</div>

<div class="footer">© 2026 妙言 AI · 深圳市链方科技有限公司</div>

<script>
(function() {
  // 1) 从 URL 提取邀请码
  const params = new URLSearchParams(window.location.search);
  const inviteCode = params.get('invite') || params.get('inviteCode') || '';

  const codeBox    = document.getElementById('code-box');
  const noCodeBox  = document.getElementById('no-code-box');
  const codeDisp   = document.getElementById('code-display');
  const openBtn    = document.getElementById('open-btn');
  const welcomeEl  = document.getElementById('welcome-text');
  const avatarEl   = document.getElementById('avatar-emoji');

  if (inviteCode) {
    // 有邀请码
    codeBox.style.display = '';
    noCodeBox.style.display = 'none';
    codeDisp.textContent = inviteCode.toUpperCase();

    // 设置 deep link URL
    openBtn.href = 'https://miaoyan.co?invite=' + encodeURIComponent(inviteCode);

    // 同时存 localStorage，download 页面和 index 页面可以读取
    try { localStorage.setItem('miaoyan_invite_code', inviteCode.toUpperCase()); } catch(e) {}

    // 更新文案
    welcomeEl.textContent = '你的好友邀请你使用';
    avatarEl.textContent = '💌';

    // 更新页面标题
    document.title = inviteCode.toUpperCase() + ' 邀请你使用妙言 AI';
  } else {
    // 没有邀请码：尝试从 localStorage 读取（可能是从 download 页面跳过来的）
    const cached = (function() { try { return localStorage.getItem('miaoyan_invite_code'); } catch(e) { return null; } })();
    if (cached) {
      codeBox.style.display = '';
      noCodeBox.style.display = 'none';
      codeDisp.textContent = cached;
      openBtn.href = 'https://miaoyan.co?invite=' + encodeURIComponent(cached);
      welcomeEl.textContent = '欢迎回来！你的邀请码是';
      avatarEl.textContent = '👋';
      document.title = cached + ' · 妙言 AI';
    } else {
      // 完全没有邀请码
      codeBox.style.display = 'none';
      noCodeBox.style.display = '';
      openBtn.href = 'https://miaoyan.co';
      openBtn.querySelector('svg').nextSibling.textContent = '打开妙言 AI 官网';
      welcomeEl.textContent = '欢迎了解';
      avatarEl.textContent = '👋';
      document.title = '妙言 AI · 高情商输入法';
    }
  }
})();
</script>
</body>
</html>
